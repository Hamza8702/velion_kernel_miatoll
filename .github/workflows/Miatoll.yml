name: Velion Kernel Build (Proton Clang)

on:
  workflow_dispatch:
  push:
    branches:
      - V2

jobs:
  build_kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: V2
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lld libssl-dev libelf-dev libncurses-dev git-core curl xz-utils python3 zip

      - name: Setup Proton Clang
        run: |
          mkdir clang
          cd clang
          curl -LO https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
          tar -xf master.tar.gz --strip-components=1
          echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export HOSTCC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          mkdir -p out
          make O=out vendor/xiaomi/atoll_defconfig

          make -j$(nproc --all) O=out \
              ARCH=$ARCH \
              CC=$CC \
              HOSTCC=$HOSTCC \
              CLANG_TRIPLE=$CLANG_TRIPLE \
              CROSS_COMPILE=$CROSS_COMPILE \
              CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
              LLVM=1 \
              LLVM_IAS=1 \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip

      - name: Package Entire Boot Directory
        run: |
          # Navigate to the boot directory and zip everything inside
          cd out/arch/arm64/boot
          zip -r ../../../../Velion_Boot_All_Files.zip ./*

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velion-Kernel-Boot-Contents
          path: Velion_Boot_All_Files.zip
