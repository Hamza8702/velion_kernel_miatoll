name: Velion Kernel Build (Proton Clang Fix)

on:
  workflow_dispatch:
  push:
    branches:
      - V2

jobs:
  build_kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: V2
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lld libssl-dev libelf-dev libncurses-dev git-core curl xz-utils python3 zip ccache gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup Ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: kernel-ccache-${{ github.sha }}
          restore-keys: |
            kernel-ccache-

      - name: Setup Proton Clang
        run: |
          mkdir -p clang
          curl -LO https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
          tar -xf master.tar.gz -C clang --strip-components=1

      - name: Build Kernel
        run: |
          # Define absolute path for Proton Clang
          CLANG_DIR=$(pwd)/clang/bin
          
          # Architecture setup
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Host Tools - Use system defaults explicitly
          export HOSTCC=/usr/bin/gcc
          export HOSTCXX=/usr/bin/g++
          export HOSTLD=/usr/bin/ld
          
          # Target Compiler - Direct paths to avoid PATH pollution
          export CC="ccache ${CLANG_DIR}/clang"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Ccache Configuration
          export CCACHE_DIR=/home/runner/.ccache
          export CCACHE_MAXSIZE=2G
          ccache -s
          
          mkdir -p out

          # Set Defconfig
          make O=out vendor/xiaomi/atoll_defconfig \
              HOSTCC=$HOSTCC \
              HOSTCXX=$HOSTCXX

          # Main Build Command
          make -j$(nproc --all) O=out \
              ARCH=$ARCH \
              CC="$CC" \
              HOSTCC=$HOSTCC \
              HOSTCXX=$HOSTCXX \
              HOSTLD=$HOSTLD \
              CLANG_TRIPLE=$CLANG_TRIPLE \
              CROSS_COMPILE=$CROSS_COMPILE \
              CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
              LLVM=1 \
              LLVM_IAS=1 \
              LD=${CLANG_DIR}/ld.lld \
              AR=${CLANG_DIR}/llvm-ar \
              NM=${CLANG_DIR}/llvm-nm \
              OBJCOPY=${CLANG_DIR}/llvm-objcopy \
              OBJDUMP=${CLANG_DIR}/llvm-objdump \
              STRIP=${CLANG_DIR}/llvm-strip

          ccache -s

      - name: Package Entire Boot Directory
        run: |
          cd out/arch/arm64/boot
          zip -r ../../../../Velion_Boot_All_Files.zip ./*

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velion-Kernel-Boot-Contents
          path: Velion_Boot_All_Files.zip
