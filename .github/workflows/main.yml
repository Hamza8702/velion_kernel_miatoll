name: Velion Kernel Build (Clang 18 + Ccache)

on:
  workflow_dispatch:
  push:
    branches:
      - V2

jobs:
  build_kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: V2
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lld libssl-dev libelf-dev libncurses-dev git-core curl xz-utils python3 zip ccache gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup Ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: kernel-ccache-${{ github.sha }}
          restore-keys: |
            kernel-ccache-

      - name: Setup Clang 18
        run: |
          mkdir -p clang
          # Using a stable Azure Clang 18 or AOSP-like distribution
          curl -LO https://github.com/Zyic/Clang/releases/download/18.1.3/Clang-18.1.3.tar.gz
          tar -xf Clang-18.1.3.tar.gz -C clang
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          CLANG_DIR=$(pwd)/clang/bin
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Force remove problematic Polly/LLVM flags for Clang 18 compatibility
          find . -type f -name "Makefile*" -o -name "*.mk" | xargs sed -i 's/-polly-loopfusion-greedy=1//g'
          find . -type f -name "Makefile*" -o -name "*.mk" | xargs sed -i 's/-polly-reschedule=1//g'
          find . -type f -name "Makefile*" -o -name "*.mk" | xargs sed -i 's/-polly-postopts=1//g'
          find . -type f -name "Makefile*" -o -name "*.mk" | xargs sed -i 's/-mllvm -polly//g'

          # Host Tools
          export HOSTCC=/usr/bin/gcc
          export HOSTCXX=/usr/bin/g++
          export HOSTLD=/usr/bin/ld
          
          # Target Compiler
          export CC="ccache ${CLANG_DIR}/clang"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          export CCACHE_DIR=/home/runner/.ccache
          export CCACHE_MAXSIZE=2G
          ccache -s
          
          mkdir -p out

          # Set Defconfig
          make O=out vendor/xiaomi/atoll_defconfig HOSTCC=$HOSTCC HOSTCXX=$HOSTCXX

          # Main Build Command
          make -j$(nproc --all) O=out \
              ARCH=$ARCH \
              CC="$CC" \
              HOSTCC=$HOSTCC \
              HOSTCXX=$HOSTCXX \
              HOSTLD=$HOSTLD \
              CLANG_TRIPLE=$CLANG_TRIPLE \
              CROSS_COMPILE=$CROSS_COMPILE \
              CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
              LLVM=1 \
              LLVM_IAS=1 \
              LD=${CLANG_DIR}/ld.lld \
              AR=${CLANG_DIR}/llvm-ar \
              NM=${CLANG_DIR}/llvm-nm \
              OBJCOPY=${CLANG_DIR}/llvm-objcopy \
              OBJDUMP=${CLANG_DIR}/llvm-objdump \
              STRIP=${CLANG_DIR}/llvm-strip \
              V=0

          ccache -s

      - name: Package Entire Boot Directory
        run: |
          cd out/arch/arm64/boot
          zip -r ../../../../Velion_Boot_Clang18_Files.zip ./*

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velion-Kernel-Clang18-Output
          path: Velion_Boot_Clang18_Files.zip
